<div class="date-picker">
  <button
    type="button"
    class="date-picker__trigger"
    [class.date-picker__trigger--active]="open"
    [attr.aria-label]="ariaLabel"
    [attr.aria-expanded]="open"
    aria-haspopup="dialog"
    (click)="toggle()"
  >
    <span [class.date-picker__placeholder]="!value">{{ displayValue }}</span>
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <rect x="3" y="4.5" width="14" height="12.5" rx="2" stroke="currentColor" stroke-width="1.4" />
      <path d="M6.5 2.8v3.4M13.5 2.8v3.4M3 8h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    </svg>
  </button>

  <div class="date-picker__popover" *ngIf="open" role="dialog" aria-label="Kalender tanggal">
    <div class="date-picker__header">
      <button type="button" class="date-picker__nav" (click)="previousMonth()" aria-label="Bulan sebelumnya">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="m12 5-5 5 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <strong>{{ monthNames[viewDate.getMonth()] }} {{ viewDate.getFullYear() }}</strong>
      <button type="button" class="date-picker__nav" (click)="nextMonth()" aria-label="Bulan berikutnya">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="m8 5 5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <div class="date-picker__weekdays" aria-hidden="true">
      <span *ngFor="let weekday of weekdays">{{ weekday }}</span>
    </div>

    <div class="date-picker__days">
      <button
        type="button"
        *ngFor="let day of calendarDays"
        [class.date-picker__day--outside]="day.outsideMonth"
        [class.date-picker__day--selected]="isSelected(day.iso)"
        [class.date-picker__day--today]="isToday(day.iso)"
        [disabled]="day.disabled"
        [attr.aria-label]="day.iso"
        (click)="selectDay(day)"
      >
        {{ day.day }}
      </button>
    </div>

    <div class="date-picker__footer">
      <button type="button" (click)="clear()">Hapus</button>
      <button type="button" (click)="selectToday()">Hari ini</button>
    </div>
  </div>
</div>
