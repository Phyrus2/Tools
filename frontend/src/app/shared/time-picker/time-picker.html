<div class="time-picker" [attr.aria-label]="ariaLabel">
  <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
    <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4" />
    <path d="M10 6v4l2.8 1.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
  </svg>
  <select [ngModel]="hour" (ngModelChange)="setHour($event)" aria-label="Hour">
    <option *ngFor="let item of hours" [value]="item">{{ item }}</option>
  </select>
  <strong>:</strong>
  <select [ngModel]="minute" (ngModelChange)="setMinute($event)" aria-label="Minute">
    <option *ngFor="let item of minutes" [value]="item">{{ item }}</option>
  </select>
  <span>WITA</span>
</div>
